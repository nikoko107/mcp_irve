[project]
name = "mcp-irve"
version = "0.1.0"
description = "Serveur MCP — éligibilité de raccordement IRVE au réseau BT Enedis (distance routière)"
readme = "mcp-raccordement-irve.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "reportlab>=4.0",
    "jinja2>=3.1",
]

[project.scripts]
mcp-irve = "mcp_irve.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pdfplumber>=0.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_irve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
